<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAWK – Documentos Legais</title>
    <meta name="description" content="Documentos legais do aplicativo JAWK: Política de Privacidade e Termos de Serviço.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0f1e;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --text: #f1f5f9;
            --muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(99,102,241,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139,92,246,0.1) 0%, transparent 50%);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 3rem;
        }

        .cards {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem 2.5rem;
            width: 260px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 32px var(--primary-glow);
            transform: translateY(-4px);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.5;
        }

        footer {
            margin-top: 4rem;
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="logo">JAWK</div>
    <p class="subtitle">Documentos Legais do Aplicativo</p>

    <div class="cards">
        <a href="/privacidade.html" class="card">
            <div class="card-icon">🔒</div>
            <h2>Aviso de Privacidade</h2>
            <p>Como coletamos, usamos e protegemos seus dados pessoais (LGPD).</p>
        </a>
        <a href="/termos.html" class="card">
            <div class="card-icon">📄</div>
            <h2>Termos e Condições de Uso</h2>
            <p>Regras, licenciamento e condições para uso da plataforma JAWK.</p>
        </a>
    </div>

    <footer>
        &copy; 2024 JAWK. Todos os direitos reservados.
    </footer>
</body>
</html>
