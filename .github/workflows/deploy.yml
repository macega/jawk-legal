name: Build & Deploy Docker Image

on:
  push:
    branches:
      - main

env:
  # Substitua pelo seu usuário do Docker Hub
  DOCKERHUB_USERNAME: macega
  IMAGE_NAME: jawk-legal

jobs:
  build-and-push:
    name: Build e Push para o Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jawk-legal:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jawk-legal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notificar Portainer (Webhook)
        if: success()
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
